# CD tự động trên máy Ubuntu của bạn (GitHub self-hosted runner).
#
# Thiết lập một lần:
#   bash docker/scripts/install-local-cicd.sh
#
# Sau khi cài runner: push lên main/master → tự pull + docker compose up --build
name: Self-hosted deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: false
        default: main

jobs:
  deploy-local:
    runs-on: self-hosted

    steps:
      - name: Deploy StayHub on this machine
        env:
          GIT_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          for f in "${{ github.workspace }}/.github/local-ci.env" \
                   "/home/kiuthi/Projects/Backend/SEP490_08-Backend/.github/local-ci.env"; do
            [ -f "$f" ] && source "$f" && break
          done
          BACKEND="${STAYHUB_BACKEND:-/home/kiuthi/Projects/Backend/SEP490_08-Backend}"
          export GIT_BRANCH
          bash "$BACKEND/docker/scripts/local-auto-deploy.sh"

# StayHub full-stack deployment
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   Frontend: http://localhost:5173
#   API Gateway: http://localhost:7010

name: stayhub

x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile.api

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Docker
  Jwt__Key: ${JWT_KEY}
  Jwt__Issuer: Auth_Server
  Jwt__Audience: StayHub_Microservices

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stayhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sql_data:/var/opt/mssql
    ports:
      - "${SQL_HOST_PORT:-14333}:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stayhub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stayhub-db-init
    user: root
    volumes:
      - ./StayHub_DatabaseSchema.sql:/scripts/schema.sql:ro
      - ./StayHub_SampleData_Insert.sql:/scripts/sample.sql:ro
      - ./docker/scripts/init-db.sh:/scripts/init-db.sh:ro
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-true}
      SQL_HOST: sqlserver
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  auth-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/AuthAPI
        PROJECT_NAME: AuthAPI
    container_name: stayhub-auth-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_IdentityDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      ConnectionStrings__Redis: redis:6379
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      EmailSettings__Host: ${EMAIL_HOST:-smtp.gmail.com}
      EmailSettings__Port: ${EMAIL_PORT:-587}
      EmailSettings__SenderName: ${EMAIL_SENDER:-StayHub Support}
      EmailSettings__SenderEmail: ${EMAIL_ADDRESS:-}
      EmailSettings__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Password: ${EMAIL_PASSWORD:-}
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://localhost:3000
      Cors__AllowedOrigins__2: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  booking-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/BookingAPI
        PROJECT_NAME: BookingAPI
    container_name: stayhub-booking-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_BookingDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      GatewayApi__BaseUrl: http://gateway-api:8080
      AuthApi__BaseUrl: http://auth-api:8080
      SystemApi__BaseUrl: http://system-api:8080
      Frontend__BaseUrl: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      InternalService__Key: ${INTERNAL_SERVICE_KEY}
      EmailSettings__Host: ${EMAIL_HOST:-smtp.gmail.com}
      EmailSettings__Port: ${EMAIL_PORT:-587}
      EmailSettings__SenderName: ${EMAIL_SENDER:-StayHub Support}
      EmailSettings__SenderEmail: ${EMAIL_ADDRESS:-}
      EmailSettings__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Password: ${EMAIL_PASSWORD:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/PaymentAPI
        PROJECT_NAME: PaymentAPI
    container_name: stayhub-payment-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_PaymentDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      GatewayApi__BaseUrl: http://gateway-api:8080
      Frontend__BaseUrl: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${PUBLIC_API_URL:-http://localhost:7010}/api/vnpay/vnpay-return
      MomoAPI__MomoApiUrl: ${MOMO_API_URL:-https://test-payment.momo.vn/gw_payment/transactionProcessor}
      MomoAPI__SecretKey: ${MOMO_SECRET_KEY:-}
      MomoAPI__AccessKey: ${MOMO_ACCESS_KEY:-}
      MomoAPI__PartnerCode: ${MOMO_PARTNER_CODE:-MOMO}
      MomoAPI__ReturnUrl: ${PUBLIC_API_URL:-http://localhost:7010}/api/momo/momo-return
      MomoAPI__NotifyUrl: ${PUBLIC_API_URL:-http://localhost:7010}/api/momo/momo-return
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  social-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/SocialAPI
        PROJECT_NAME: SocialAPI
    container_name: stayhub-social-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_SocialDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      ConnectionStrings__Redis: redis:6379
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  tour-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/TourAPI
        PROJECT_NAME: TourAPI
    container_name: stayhub-tour-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_CatalogDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      GatewayApi__BaseUrl: http://gateway-api:8080
      SystemApi__BaseUrl: http://system-api:8080
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  voucher-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/VoucherAPI
        PROJECT_NAME: VoucherAPI
    container_name: stayhub-voucher-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_VoucherDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      Gateway__BaseUrl: http://gateway-api:8080
      InternalService__Key: ${INTERNAL_SERVICE_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/AIAPI
        PROJECT_NAME: AIAPI
    container_name: stayhub-ai-api
    volumes:
      - ai_models:/app/MLModels
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_AiDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      Gateway__BaseUrl: http://gateway-api:8080
      Ml__ModelsDirectory: MLModels
      Ml__RetrainOnStartupIfMissing: "true"
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  content-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/ContentAPI
        PROJECT_NAME: ContentAPI
    container_name: stayhub-content-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_ContentDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      ConnectionStrings__Redis: redis:6379
      ApiUrls__TourAPI: http://tour-api:8080
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  system-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/SystemAPI
        PROJECT_NAME: SystemAPI
    container_name: stayhub-system-api
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=StayHub_SystemDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway-api:
    build:
      <<: *api-build
      args:
        PROJECT_PATH: StayHub/GatewayAPI
        PROJECT_NAME: GatewayAPI
    container_name: stayhub-gateway-api
    ports:
      - "7010:8080"
    environment:
      <<: *api-env
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins__0: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://localhost:3000
      Cors__AllowedOrigins__2: http://frontend
    depends_on:
      auth-api:
        condition: service_started
      booking-api:
        condition: service_started
      payment-api:
        condition: service_started
      social-api:
        condition: service_started
      tour-api:
        condition: service_started
      voucher-api:
        condition: service_started
      ai-api:
        condition: service_started
      content-api:
        condition: service_started
      system-api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../../Frontend/SEP490_08-Frontend/stayhub
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:7010}
        VITE_API_PREFIX: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID:-}
        VITE_CHATBOX: ${VITE_CHATBOX:-}
        VITE_CAPCHA_KEY: ${VITE_CAPCHA_KEY:-}
    container_name: stayhub-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway-api
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    container_name: stayhub-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - gateway-api
    restart: unless-stopped

volumes:
  sql_data:
  ai_models:
  caddy_data:
  caddy_config:
